<!DOCTYPE html>
<html>
    <head>
        <title>Fungsi</title>
    </head>
    <body>
        <h2>Daftar Person</h2>
        <input type="text" id="searchName" placeholder="Masukan Nama" oninput="cari()">
        <table border="1">
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Umur</th>
                    <th onclick="sortData('height')">Tinggi Badan (cm) <span id="sort-icon-height">↕️</span></th>
                    <th onclick="sortData('weight')">Berat Badan (kg) <span id="sort-icon-weight">↕️</span></th>
                </tr>
            </thead>
            <tbody id="output"></tbody>
        </table>
        <button onclick="openModal()">Tambah Person</button>
        
        <dialog id="modalTambah">
        <h3>Tambah Person</h3>
        <input type="text" id="name" placeholder="Nama">
        <input type="number" id="age" placeholder="Umur">
        <input type="number" id="height" placeholder="Tinggi Badan (cm)">
        <input type="number" id="weight" placeholder="Berat Badan (kg)">
        <button onclick="tambah()">Tambah</button>
        <button onclick="closeModal()">Close</button>
        </dialog>

        <h3>Hapus Person</h3>
        <input type="text" id="deleteName" placeholder="Masukan Nama">
        <button onclick="hapus()">Delete</button>
        <p id="deleteResult"></p>
        
        <script src="script.js"></script>
    </body>
</html>
